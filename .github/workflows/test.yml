name: Test formula

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  formula:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Add local tap
        run: brew tap stackshiftCloud/tap "$GITHUB_WORKSPACE"

      - name: Audit formula
        run: brew audit --formula stackshiftCloud/tap/stackshift

      - name: Install and verify
        run: |
          brew install stackshiftCloud/tap/stackshift
          expected="$(brew info --json=v2 stackshiftCloud/tap/stackshift |
            ruby -rjson -e 'puts JSON.parse($stdin.read)["formulae"][0]["versions"]["stable"]')"
          stackshift version | grep "CLI[[:space:]]*$expected"
          binary="$(brew --prefix stackshift)/bin/stackshift"
          if xattr -p com.apple.quarantine "$binary" >/dev/null 2>&1; then
            echo "::error::Homebrew left the quarantine attribute on $binary"
            exit 1
          fi
